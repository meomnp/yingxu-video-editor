name: Validate pinned FFmpeg source builds

on:
  pull_request:
    paths:
      - .github/workflows/validate-ffmpeg-sources.yml
      - scripts/build_ffmpeg_source_validation.sh
  workflow_dispatch:
    inputs:
      run_validation:
        description: Build FFmpeg, x264, and FreeType from pinned source; no app package or artifact is published
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate-windows:
    if: github.event_name == 'pull_request' || inputs.run_validation == true
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out 映序 source
        uses: actions/checkout@v4

      - name: Set up free MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            diffutils
            pkgconf
            cmake
            meson
            ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm

      - name: Build pinned FFmpeg + x264 + FreeType and run encode/filter/probe smoke test
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg_source_validation.sh windows

  validate-macos:
    if: github.event_name == 'pull_request' || inputs.run_validation == true
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out 映序 source
        uses: actions/checkout@v4

      - name: Install NASM from the free runner package manager
        run: brew install nasm cmake meson ninja

      - name: Build pinned FFmpeg + x264 + FreeType and run encode/filter/probe smoke test
        run: bash scripts/build_ffmpeg_source_validation.sh macos
