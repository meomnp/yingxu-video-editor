name: Build macOS portable candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # Avoid rebuilding the same candidate for every follow-up/doc-only push.
    # Use workflow_dispatch for an intentional refresh after code changes.
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  build-macos:
    # The repository is public, so standard GitHub-hosted macOS runners are free.
    # Build only Apple Silicon for this first candidate; do not notarize or sign.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools and FFmpeg
        run: |
          brew install ffmpeg dylibbundler
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build and smoke-test portable app
        run: bash scripts/build_macos.sh

      - name: Keep artifact within free storage allowance
        run: |
          bytes="$(stat -f%z dist/映序-macOS-arm64-便携测试候选.zip)"
          limit=$((450 * 1024 * 1024))
          echo "Candidate artifact size: $bytes bytes; upload guard: $limit bytes"
          if [ "$bytes" -gt "$limit" ]; then
            echo "Not uploading: artifact exceeds the 450 MiB safety cap."
            exit 1
          fi

      - name: Upload one-day candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: yingxu-macos-arm64-unsigned
          path: |
            dist/映序-macOS-arm64-便携测试候选.zip
            dist/映序-macOS-arm64-便携测试候选.zip.sha256
          if-no-files-found: error
          retention-days: 1
